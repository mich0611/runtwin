[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runtwin"
version = "0.1.0"
description = "Self-hosted, evidence-traceable running analytics for Strava"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.1,<5.3",
  "djangorestframework>=3.15,<3.17",
  "psycopg[binary]>=3.2,<3.4",
  "pydantic>=2.9,<3",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "gunicorn>=23,<24",
  "whitenoise>=6.8,<7",
  "anthropic>=1.6,<3",
  "openai>=3.50,<4",
  "garminconnect>=0.3.2,<0.4",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-django>=4.9,<5",
  "pytest-cov>=6,<7",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q --disable-warnings"

[tool.setuptools.packages.find]
include = ["config*", "runtwin*"]
